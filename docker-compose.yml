services:
  api:
    build: .
    container_name: llm-eval-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/llm_eval_platform
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      AUTO_CREATE_TABLES: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: llm-eval-postgres
    environment:
      POSTGRES_DB: llm_eval_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_eval_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: llm-eval-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      
  worker:
    build: .
    command: python workers/worker.py
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
