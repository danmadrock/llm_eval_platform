name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      LIVE_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy llm_eval_platform/api llm_eval_platform/core llm_eval_platform/models

      - name: Pytest
        run: pytest

      - name: Eval gate dry-run
        run: |
          python llm_eval_platform/scripts/ci_eval_gate.py \
            --baseline llm_eval_platform/fixtures/eval_gates/baseline.json \
            --candidate llm_eval_platform/fixtures/eval_gates/candidate.json